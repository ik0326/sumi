name: Sumi
options:
  bundleIdPrefix: local.sumi
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.1"
targets:
  Sumi:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
    sources:
      - path: Sumi
        excludes:
          - "Resources/editor/**"
      - path: Sumi/Resources/editor
        type: folder
    info:
      path: Sumi/Info.plist
      properties:
        SUFeedURL: https://github.com/ik0326/sumi/releases/latest/download/appcast.xml
        SUPublicEDKey: ltobyM5ko0zYSeQ5cC1d+yZ3Q04VNE/u4y8wtIzuDSA=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - net.daringfireball.markdown
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
                - mdown
    settings:
      base:
        INFOPLIST_FILE: Sumi/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: local.sumi.Sumi
        PRODUCT_NAME: Sumi
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_CFBundleDisplayName: Sumi
        MARKETING_VERSION: "0.7.0"
        CURRENT_PROJECT_VERSION: "7"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
