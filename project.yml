name: Sumi
options:
  bundleIdPrefix: local.sumi
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
targets:
  Sumi:
    type: application
    platform: macOS
    sources:
      - path: Sumi
        excludes:
          - "Resources/editor/**"
      - path: Sumi/Resources/editor
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.sumi.Sumi
        PRODUCT_NAME: Sumi
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_CFBundleDisplayName: Sumi
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "3"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
